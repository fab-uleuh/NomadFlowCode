[package]
name = "nomadflow-core"
version = "1.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["process", "time", "fs"] }
thiserror = "2"
git2 = "0.20"
dirs = "6"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
filetime = "0.2"
